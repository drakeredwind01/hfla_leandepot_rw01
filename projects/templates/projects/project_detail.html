{% extends 'projects/base.html' %}
{% block content %}
<h1>{{ project.name }}</h1>
<h2>Members &rarr; Permissions</h2>
<ul>
  {% for perm in permissions %}
  <li><a href="/members/{{ perm.member.pk }}/">{{ perm.member.name }}</a>
    <ul>
      <li><a href="/permissions/{{ perm.pk }}/">{{ perm.name }}</a></li>
    </ul>
  </li>
  {% endfor %}
</ul>
{% endblock %}
